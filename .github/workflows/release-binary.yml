name: Release v12 candidate
on:
  push:
    tags: ['v12.*']
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-11
      - run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/build_v12_release.sh
      - name: Create draft validator release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Dungeon $GITHUB_REF_NAME" --notes-file docs/upgrades/v12.md build/v12-release/*.tar.gz build/v12-release/SHA256SUMS
